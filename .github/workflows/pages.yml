name: Build and deploy InfraSAR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infrasar-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build and browser test dependencies
        run: |
          python -m pip install -r requirements-site.txt "playwright>=1.52,<2"
          python -m playwright install --with-deps chromium
      - name: Verify the science and build the static site
        run: |
          python scripts/verify_science.py
          python -m unittest discover -s roseires-trends -p 'test_*.py'
          python -m unittest discover -s roseires-pipeline -p 'test_*.py'
          python scripts/build_site.py
      - name: Test the site without network resources
        run: python scripts/smoke_site.py dist/index.html
      - name: Capture before and after screenshots
        run: |
          python -m http.server 8128 --bind 127.0.0.1 --directory dist &
          python scripts/capture_design_review.py https://nhaile360.github.io/InfraSAR/ before
          python scripts/capture_design_review.py http://127.0.0.1:8128/ after
      - uses: actions/upload-artifact@v4
        with:
          name: infrasar-design-screenshots
          path: design-screenshots/

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event.repository.has_pages || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify the public site and deployed commit
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          python -m pip install "playwright>=1.52,<2"
          python -m playwright install --with-deps chromium
          python scripts/smoke_site.py "$SITE_URL" --revision "$GITHUB_SHA"
